name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheap, first, and independent of any build: the repository refuses to record an AI
  # assistant as a commit co-author, and that holds for all of main. The check self-tests
  # before it answers, because a clean history and a broken detector look identical from
  # here. Full history is required -- it states the invariant over everything reachable,
  # not just this push.
  loom-commit-attribution:
    name: Loom / commit attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Loom with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse AI co-authorship in reachable history
        run: cmake -P tests/check_commit_attribution.cmake

  # Does the change touch a compiled line? tests/check_change_kind.cmake answers from the base (a
  # pull request's merge parent, or the push's previous tip) to this commit; only its explicit
  # `false` skips the build and test jobs, so a broken answer runs them all.
  loom-change-kind:
    name: Loom / change kind
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      compiled: ${{ steps.kind.outputs.compiled }}
    steps:
      - name: Check out Loom with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the change
        id: kind
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="$(git rev-parse HEAD^1)"
          else
            base="$BEFORE"
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No base commit to compare with; every job runs."
            echo "compiled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cmake -DZEN_BASE="$base" -DZEN_HEAD=HEAD -DZEN_KIND_OUT="$GITHUB_OUTPUT" -P tests/check_change_kind.cmake

  # The documentation lane's checks, on every change: they read the source tree, not a build.
  loom-documentation:
    name: Loom / documentation lane
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Loom
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the text checks
        run: cmake -DZEN_LANE_KIND=OFF -P tests/documentation_lane.cmake

  loom-linux-debug:
    name: Loom / Linux / Debug
    needs: loom-change-kind
    if: ${{ !cancelled() && needs.loom-change-kind.outputs.compiled != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Loom
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record toolchain
        run: |
          g++ --version
          cmake --version
          nm --version

      # Hosted-image workaround, not a Loom requirement: ubuntu-24.04 as shipped
      # restricts the unprivileged user namespaces the isolation suites create, and
      # the official lane fails there without this ephemeral change. Remove it only
      # with a run that passes without it.
      - name: Permit Loom's unprivileged sandbox namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Verify the repository-owned population (verbose evidence lane)
        run: |
          set +e
          cmake -DZEN_BUILD_DIR=build -DZEN_CTEST_ARGS=-V -P tests/verify.cmake 2>&1 | tee verify.log
          verify_rc="${PIPESTATUS[0]}"
          verify_outcome=failed
          if (( verify_rc == 0 )); then verify_outcome=passed; fi
          {
            printf '## Loom / Linux / Debug\n\n'
            printf '**Verification:** %s (exit %s)\n\n' "$verify_outcome" "$verify_rc"
            printf 'Selected lines from the repository verifier and CTest output:\n\n'
            printf '```text\n'
            grep -E 'verify:|[0-9]+% tests passed|test cases:|assertions:|OS-enforcement cases executed|DECLARED ABSENT|Total Test time' verify.log || true
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$verify_rc"

  loom-linux-release:
    name: Loom / Linux / Release
    needs: loom-change-kind
    if: ${{ !cancelled() && needs.loom-change-kind.outputs.compiled != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Loom
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record toolchain
        run: |
          g++ --version
          cmake --version
          nm --version

      # Hosted-image workaround, not a Loom requirement: ubuntu-24.04 as shipped
      # restricts the unprivileged user namespaces the isolation suites create, and
      # the official lane fails there without this ephemeral change. Remove it only
      # with a run that passes without it.
      - name: Permit Loom's unprivileged sandbox namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Configure
        run: cmake -S . -B build-rel -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-rel --parallel "$(nproc)"

      - name: Verify the repository-owned population
        run: |
          set +e
          cmake -DZEN_BUILD_DIR=build-rel -P tests/verify.cmake 2>&1 | tee verify.log
          verify_rc="${PIPESTATUS[0]}"
          verify_outcome=failed
          if (( verify_rc == 0 )); then verify_outcome=passed; fi
          {
            printf '## Loom / Linux / Release\n\n'
            printf '**Verification:** %s (exit %s)\n\n' "$verify_outcome" "$verify_rc"
            printf 'Selected lines from the repository verifier and CTest output:\n\n'
            printf '```text\n'
            grep -E 'verify:|[0-9]+% tests passed|test cases:|assertions:|OS-enforcement cases executed|DECLARED ABSENT|Total Test time' verify.log || true
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$verify_rc"

  loom-linux-asan-ubsan:
    name: Loom / Linux / ASan + UBSan
    needs: loom-change-kind
    if: ${{ !cancelled() && needs.loom-change-kind.outputs.compiled != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Loom
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record toolchain
        run: |
          g++ --version
          cmake --version
          nm --version

      # Hosted-image workaround, not a Loom requirement: ubuntu-24.04 as shipped
      # restricts the unprivileged user namespaces the isolation suites create, and
      # the official lane fails there without this ephemeral change. Remove it only
      # with a run that passes without it.
      - name: Permit Loom's unprivileged sandbox namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Configure
        run: cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug -DZEN_SANITIZE=ON

      - name: Build
        run: cmake --build build-san --parallel "$(nproc)"

      - name: Verify the repository-owned population
        run: |
          set +e
          cmake -DZEN_BUILD_DIR=build-san -P tests/verify.cmake 2>&1 | tee verify.log
          verify_rc="${PIPESTATUS[0]}"
          verify_outcome=failed
          if (( verify_rc == 0 )); then verify_outcome=passed; fi
          {
            printf '## Loom / Linux / ASan + UBSan\n\n'
            printf '**Verification:** %s (exit %s)\n\n' "$verify_outcome" "$verify_rc"
            printf 'Selected lines from the repository verifier and CTest output:\n\n'
            printf '```text\n'
            grep -E 'verify:|[0-9]+% tests passed|test cases:|assertions:|OS-enforcement cases executed|DECLARED ABSENT|Total Test time' verify.log || true
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$verify_rc"

  loom-zengine-stranger:
    name: Loom -> canonical Zengine stranger
    needs: loom-change-kind
    if: ${{ !cancelled() && needs.loom-change-kind.outputs.compiled != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Loom
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record toolchain
        run: |
          g++ --version
          cmake --version
          nm --version

      - name: Resolve canonical Zengine once
        id: zengine
        run: |
          zengine_sha="$(git ls-remote https://github.com/Krealsion/Zengine.git refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [[ ! "$zengine_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve canonical Zengine main" >&2
            exit 1
          fi
          echo "Canonical Zengine: $zengine_sha"
          echo "sha=$zengine_sha" >> "$GITHUB_OUTPUT"

      - name: Fetch pinned canonical Zengine
        env:
          ZENGINE_SHA: ${{ steps.zengine.outputs.sha }}
        run: |
          zengine_source="$RUNNER_TEMP/zengine-src"
          git init "$zengine_source"
          git -C "$zengine_source" remote add origin https://github.com/Krealsion/Zengine.git
          git -C "$zengine_source" fetch --depth=1 origin "$ZENGINE_SHA"
          git -C "$zengine_source" checkout --detach FETCH_HEAD
          test "$(git -C "$zengine_source" rev-parse HEAD)" = "$ZENGINE_SHA"

      - name: Build and install Loom to a fresh prefix
        run: |
          loom_prefix="$RUNNER_TEMP/loom-prefix"
          test ! -e "$loom_prefix"
          cmake -S . -B build-stranger -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-stranger --parallel "$(nproc)"
          cmake --install build-stranger --prefix "$loom_prefix"

      - name: Configure canonical Zengine as a stranger
        run: |
          cmake -S "$RUNNER_TEMP/zengine-src" -B "$RUNNER_TEMP/zengine-build" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/loom-prefix" \
            -DZEN_LOOM_DEV=OFF \
            -DBUILD_TESTING=ON

      - name: Build canonical Zengine
        run: cmake --build "$RUNNER_TEMP/zengine-build" --parallel "$(nproc)"

      # Zengine's OWN official lane, run from the canonical checkout this job fetched.
      # This job claims to verify Zengine, so it has to ask Zengine's question: a bare
      # `ctest` here would report 10/10 over a tree that had lost a whole test case or
      # a whole entry, and this lane's whole purpose is to be the thing a
      # stranger's result is quoted from. The expected population lives in Zengine's
      # tests/test_population.txt; no count belongs in this file.
      - name: Verify canonical Zengine's repository-owned population
        run: |
          set +e
          cmake -DZEN_BUILD_DIR="$RUNNER_TEMP/zengine-build" \
                -P "$RUNNER_TEMP/zengine-src/tests/verify.cmake" 2>&1 | tee zengine-verify.log
          verify_rc="${PIPESTATUS[0]}"
          verify_outcome=failed
          if (( verify_rc == 0 )); then verify_outcome=passed; fi
          {
            printf '## Loom -> canonical Zengine stranger\n\n'
            printf '**Verification:** %s (exit %s)\n\n' "$verify_outcome" "$verify_rc"
            printf 'Selected lines from the Zengine verifier and CTest output:\n\n'
            printf '```text\n'
            grep -E 'verify:|population:|cases \(floor|judged on|[0-9]+% tests passed|test cases:|assertions:|DECLARED ABSENT|Total Test time' zengine-verify.log || true
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$verify_rc"

  loom-windows-kernel-full:
    name: Loom / Windows / kernel-full (advisory)
    needs: loom-change-kind
    if: ${{ !cancelled() && needs.loom-change-kind.outputs.compiled != 'false' }}
    runs-on: windows-2025
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - name: Check out Loom
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record selected MinGW-w64 toolchain
        shell: pwsh
        run: |
          & 'C:\mingw64\bin\g++.exe' --version
          cmake --version
          & 'C:\mingw64\bin\nm.exe' --version
          ninja --version

      - name: Configure with MinGW-w64
        shell: pwsh
        run: >-
          cmake -S . -B build-win-kernel -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=C:/mingw64/bin/gcc.exe
          -DCMAKE_CXX_COMPILER=C:/mingw64/bin/g++.exe
          -DLOOM_ENABLE_WINDOWS_KERNEL=ON

      - name: Build
        run: cmake --build build-win-kernel

      - name: Verify the repository-owned population
        run: cmake -DZEN_BUILD_DIR=build-win-kernel -P tests/verify.cmake

  # The MSVC lane. "Windows" is not one toolchain: the MinGW lanes above can be green
  # while a normal MSVC consumer cannot compile Loom's public shape macros at all, or
  # link a weave.
  #
  # STEP ORDER IS DELIBERATE. The installed-package witness runs BEFORE the repository
  # population, because it is the claim this lane exists to keep honest and it must be
  # exercised on every run. `tests/package/run.cmake` reaches Loom only through
  # find_package -- no flags, no sibling paths -- and asks dumpbin what the produced
  # weave actually exports, so it fails if the package ever stops carrying
  # /Zc:preprocessor or the ABI symbol loses its exact undecorated spelling.
  #
  # WHY IT STAYS ON DEBUG. MSVC's Debug frames are the thickest of any lane, so a deep
  # recursion every other lane survives can exhaust the stack here first: a recursive
  # component-tree walk did, below the depth the UI cap accepted -- a real defect, not
  # an MSVC quirk, and only this lane showed it. Moving the lane to Release would buy a
  # green by choosing the configuration that passes. Keep it on Debug -- the thickest
  # frames are the point.
  loom-windows-msvc:
    name: Loom / Windows / MSVC + installed-package witness (advisory)
    needs: loom-change-kind
    if: ${{ !cancelled() && needs.loom-change-kind.outputs.compiled != 'false' }}
    runs-on: windows-2025
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - name: Check out Loom
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Compiler selection is part of the evidence: the toolset is chosen explicitly
      # through vswhere rather than left to whatever CMake happens to find.
      - name: Record selected MSVC toolset
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "No MSVC x64 toolset on this image" }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          cl 2>&1 | Select-Object -First 2
          cmake --version
          ninja --version

      - name: Configure and build with MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          cmake -S . -B build-msvc -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLOOM_ENABLE_WINDOWS_KERNEL=ON
          cmake --build build-msvc

      - name: Install to a fresh prefix and run the installed-package witness
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          $prefix = Join-Path $env:RUNNER_TEMP 'loom-msvc-prefix'
          if (Test-Path -LiteralPath $prefix) { throw "Fresh Loom prefix already exists: $prefix" }
          cmake --install build-msvc --prefix $prefix
          cmake "-DZEN_PREFIX=$prefix" "-DZEN_WORK=$(Join-Path $env:RUNNER_TEMP 'pkg-witness')" -P tests/package/run.cmake

      - name: Verify the repository-owned population
        shell: pwsh
        run: cmake -DZEN_BUILD_DIR=build-msvc -P tests/verify.cmake

  loom-windows-kernel-less:
    name: Loom / Windows / default kernel-less (advisory)
    needs: loom-change-kind
    if: ${{ !cancelled() && needs.loom-change-kind.outputs.compiled != 'false' }}
    runs-on: windows-2025
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - name: Check out Loom
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record selected MinGW-w64 toolchain
        shell: pwsh
        run: |
          & 'C:\mingw64\bin\g++.exe' --version
          cmake --version
          & 'C:\mingw64\bin\nm.exe' --version
          ninja --version

      - name: Configure with MinGW-w64
        shell: pwsh
        run: >-
          cmake -S . -B build-win-default -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=C:/mingw64/bin/gcc.exe
          -DCMAKE_CXX_COMPILER=C:/mingw64/bin/g++.exe

      - name: Build
        run: cmake --build build-win-default

      - name: Verify the repository-owned population
        run: cmake -DZEN_BUILD_DIR=build-win-default -P tests/verify.cmake
