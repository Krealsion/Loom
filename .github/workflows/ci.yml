        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record toolchain
        run: |
          g++ --version
          cmake --version
          nm --version

      # Hosted-image workaround, not a Loom requirement. R2F-Fa's control pair
      # measured the official verifier failing on ubuntu-24.04 as shipped and
      # passing after this ephemeral change. Remove only with replacement evidence.
      - name: Permit Loom's unprivileged sandbox namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Configure
        run: cmake -S . -B build-rel -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-rel --parallel "$(nproc)"

      - name: Verify the repository-owned population
        run: |
          set +e
          cmake -DZEN_BUILD_DIR=build-rel -P tests/verify.cmake 2>&1 | tee verify.log
          verify_rc="${PIPESTATUS[0]}"
          verify_outcome=failed
          if (( verify_rc == 0 )); then verify_outcome=passed; fi
