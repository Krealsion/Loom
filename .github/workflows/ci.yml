name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheap, first, and independent of any build: the repository refuses to record an AI
  # assistant as a commit co-author, and after HIST-1 that is true of all of main. The
  # check self-tests before it answers, because a clean history and a broken detector
  # look identical from here. Full history is required -- it states the invariant over
  # everything reachable, not just today's push.
  loom-commit-attribution:
    name: Loom / commit attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Loom with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse AI co-authorship in reachable history
        run: cmake -P tests/check_commit_attribution.cmake

  loom-linux-debug:
    name: Loom / Linux / Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Loom
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record toolchain
        run: |
          g++ --version
          cmake --version
          nm --version

      # Hosted-image workaround, not a Loom requirement. R2F-Fa's control pair
      # measured the official verifier failing on ubuntu-24.04 as shipped and
      # passing after this ephemeral change. Remove only with replacement evidence.
      - name: Permit Loom's unprivileged sandbox namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Verify the repository-owned population (verbose evidence lane)
        run: |
          set +e
          cmake -DZEN_BUILD_DIR=build -DZEN_CTEST_ARGS=-V -P tests/verify.cmake 2>&1 | tee verify.log
          verify_rc="${PIPESTATUS[0]}"
          verify_outcome=failed
          if (( verify_rc == 0 )); then verify_outcome=passed; fi
          {
            printf '## Loom / Linux / Debug\n\n'
            printf '**Verification:** %s (exit %s)\n\n' "$verify_outcome" "$verify_rc"
            printf 'Selected lines from the repository verifier and CTest output:\n\n'
            printf '```text\n'
            grep -E 'verify:|[0-9]+% tests passed|test cases:|assertions:|OS-enforcement cases executed|DECLARED ABSENT|Total Test time' verify.log || true
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$verify_rc"

  loom-linux-release:
    name: Loom / Linux / Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
